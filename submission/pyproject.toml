[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FYP"
version = "1.0.0"
description = "Budgeted prediction-market opportunity screening and economic replay"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.4", "pandas==3.0.2", "pyarrow==23.0.1",
  "scikit-learn==1.7.2", "xgboost==3.2.0", "tabm==0.0.3",
  "torch==2.10.0", "joblib==1.6.0", "threadpoolctl==3.6.0",
  "matplotlib==3.11.2", "reportlab==5.1.0"
]

[project.optional-dependencies]
notebook = ["jupyterlab==4.6.4", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.2.0"]
verification = ["pypdf==6.14.2"]

[project.scripts]
fyp-study = "FYP.experiments.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["FYP*"]
